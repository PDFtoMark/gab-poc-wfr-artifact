name: Dependency Review

on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

permissions:
  actions: read # to download dependency graph artifact
  contents: write # to submit dependency graph
  pull-requests: read # to resolve PR info for fork PRs

jobs:
  dependency-review:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR
        id: get-pr
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const wfRun = context.payload.workflow_run;
            const pr = wfRun.pull_requests[0];
            let number, base_sha, head_sha;
            if (pr) {
              number = pr.number;
              base_sha = pr.base.sha;
              head_sha = pr.head.sha;
            } else {
              const headLabel = `${wfRun.head_repository.owner.login}:${wfRun.head_branch}`;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: headLabel,
              });
              const matched = prs[0];
              if (!matched) throw new Error(`No open PR found for head ${headLabel}`);
              number = matched.number;
              base_sha = matched.base.sha;
              head_sha = wfRun.head_sha;
            }
            core.info(`is_fork:  ${pr ? 'false' : 'true'}`);
            core.info(`number:   ${number}`);
            core.info(`base_sha: ${base_sha}`);
            core.info(`head_sha: ${head_sha}`);
            core.setOutput('is_fork', pr ? 'false' : 'true');
            core.setOutput('number', number);
            core.setOutput('base_sha', base_sha);
            core.setOutput('head_sha', head_sha)

      # Stand-in for gradle/actions/dependency-submission (download-and-submit) plus
      # actions/dependency-review-action. The dependency-graph API is disabled in this
      # test org, so the summary that the real action would render from the attacker's
      # snapshot manifest names is produced locally, using the same @actions/core
      # addScannedFiles() rendering ("<ul><li>manifest</li></ul>").
      - name: dependency review (stub identical output shape)
        id: dependency-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/actions/runs/${{ github.event.workflow_run.id }}/artifacts" -o /tmp/arts.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/arts.json'))
          print('artifacts:', [a['name'] for a in d.get('artifacts', [])])
          for a in d.get('artifacts', []):
              if a['name'].startswith('dependency-graph_'):
                  open('/tmp/url', 'w').write(a['archive_download_url'])
          PY
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$(cat /tmp/url)" -o /tmp/art.zip
          mkdir -p dependency-graph-reports
          unzip -o -q /tmp/art.zip -d dependency-graph-reports
          echo "--- extracted:"; find dependency-graph-reports -type f
          {
            echo "comment-content<<GABEOF"
            python3 - <<'PY'
          import glob, json
          keys = []
          for f in glob.glob('dependency-graph-reports/**/*.json', recursive=True):
              keys.extend(list(json.load(open(f)).get('manifests', {}).keys()))
          keys.sort()
          print('<h2>Scanned Files</h2>')
          print('<ul>' + ''.join('<li>%s</li>' % k for k in keys) + '</ul>')
          PY
            echo
            echo "GABEOF"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.dependency-review.outputs.comment-content != null }}
        name: Save dependency review output report
        run: |
          cat << 'EOF' > openssf-report.html
          ${{ steps.dependency-review.outputs.comment-content }}
          EOF

      - if: ${{ steps.dependency-review.outputs.comment-content != null }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.get-pr.outputs.number }}
          header: dependency-review
          hide_and_recreate: true
          path: openssf-report.html
          GITHUB_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}

      - if: always()
        name: show proof
        run: |
          echo "--- hook-proof.txt:"
          cat hook-proof.txt || echo "(no hook proof)"
          echo "--- report bytes:"
          wc -c openssf-report.html || true
