name: Eval Report POC-ART

on:
  workflow_run:
    workflows: ["Eval Upstream POC-ART"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha || github.event.repository.default_branch }}

      - name: Download raw evaluation results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skill-eval-raw
          path: evals/results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compare with baseline
        continue-on-error: true
        run: node evals/results/generate-compare-json.js

      - name: Show proof
        if: always()
        run: |
          echo "--- proof file ---"
          cat rce-proof.txt || echo "no proof file"
          echo "--- persisted credentials in git config ---"
          grep -c "AUTHORIZATION" .git/config || true
