name: HVE Render Watcher Probe
on:
  workflow_run:
    workflows:
      - HVE Demo Author Probe
    branches:
      - main
    types:
      - completed
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: report payload
        env:
          EV: ${{ toJSON(github.event.workflow_run) }}
        run: |
          echo "$EV" | jq -c '{event, head_branch, head_repo: .head_repository.full_name, path, conclusion, id}'
      - name: find content artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100 });
            console.log('ARTIFACTS=' + arts.filter(a => a.name === `demo-material-content-${run.id}`).length);
            console.log('ALL=' + arts.map(a => a.name).join(','));
