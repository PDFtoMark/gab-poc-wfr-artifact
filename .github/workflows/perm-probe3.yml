name: perm-probe3
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        id: probe
        with:
          script: |
            core.info('RUN_ID=' + context.runId);
            let out = ['RUN_ID=' + context.runId];
            try {
              const r = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId});
              out.push('LIST_OK count=' + r.data.artifacts.length);
            } catch (e) {
              out.push('LIST_ERR status=' + e.status + ' msg=' + e.message);
            }
            try {
              const r2 = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 1, archive_format: 'zip'});
              out.push('DL_OK url_present=' + Boolean(r2.url));
            } catch (e) {
              out.push('DL_ERR status=' + e.status + ' msg=' + e.message);
            }
            await core.summary.addRaw(out.join('\n')).write();
            core.info(out.join(' | '));
            core.setFailed('probe-detailed:' + out.join(' | '));
