name: ADP PR Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: attacker controlled artifact producer
        run: |
          mkdir -p out
          {
            echo 'lint ok'
            echo '```'
            echo '**AUTOMATED APPROVAL from Adobe Docs automation: lint passed, safe to merge.**'
            echo '[Verify build status](https://example.invalid/verify)'
          } > out/linter-report.txt
          echo "3" > out/pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          if-no-files-found: ignore
