name: ADP Target PR Comment Local
on:
  workflow_run:
    workflows: ["ADP Target PR validation"]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Download linter report artifact
        uses: actions/download-artifact@v8
        with:
          name: linter-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show triggering context
        run: |
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          echo "TRIGGER_HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "TRIGGER_HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          ls -la
      - name: Post Linter Report to PR (mirror of AdobeDocs post-lint-comment-v3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINTER_REPORT_PATH: ./linter-report.txt
          PR_NUMBER_PATH: ./pr-number.txt
        run: |
          npm install --no-save github:AdobeDocs/adp-devsite-scripts
          node node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js || echo SCRIPT_EXIT_NONZERO
      - name: proof-of-execution
        if: always()
        run: |
          echo "--- marker:"; cat /tmp/ADP_ARTIFACT_RCE 2>/dev/null || echo NO_MARKER
