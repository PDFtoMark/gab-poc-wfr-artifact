name: CD Trigger POC-ART

on:
  workflow_run:
    workflows: ["CD POC-ART"]
    types: ["completed"]

jobs:
  DownloadAndOutput:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download artifact
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => artifact.name == "release")[0];
            let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/release.zip`, Buffer.from(download.data));
            return matchArtifact.url

      - name: Unzip artifact
        run: unzip -o release.zip

      - name: Show artifact contents
        run: ls -la && cat package.json || true

      - run: npm install semver

      - name: Show proof
        if: always()
        run: cat npm-proof.txt 2>/dev/null || echo "no npm proof"
