name: Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: payload/
          include-hidden-files: true
