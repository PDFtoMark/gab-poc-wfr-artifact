name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact with attacker-controlled file names and contents
        run: |
          mkdir -p /tmp/content
          printf 'hello from attacker PR\n' > /tmp/content/summary.txt
          printf '%s\n' '${{ github.event.number }}' > /tmp/content/pr_number.txt
          printf 'x\n' > '/tmp/content/x;echo${IFS}INJECTED_MARKER_OK;true;#z.txt'
          ls -la /tmp/content
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: /tmp/content
