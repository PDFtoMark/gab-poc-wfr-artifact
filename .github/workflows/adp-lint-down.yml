name: ADP Lint Down
on:
  workflow_run:
    workflows: ["ADP Lint Up"]
    types: [completed]
permissions:
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Download linter report artifact
        uses: actions/download-artifact@v8
        with:
          name: linter-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post Linter Report to PR (mirrors AdobeDocs/workflow)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINTER_REPORT_PATH: ./linter-report.txt
          PR_NUMBER_PATH: ./pr-number.txt
        run: |
          echo "--- workspace:"; ls -la
          npm install --no-save github:AdobeDocs/adp-devsite-scripts
          echo "--- marker:"; cat /tmp/ADP_RCE_MARKER 2>/dev/null || echo NO_MARKER
          node node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js || echo SCRIPT_EXIT_NONZERO
