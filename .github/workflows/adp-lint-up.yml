name: ADP Lint Up
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-controlled payload with root-level file names
        run: |
          mkdir -p /tmp/root
          cat > /tmp/root/package.json <<'JSON'
          {
            "name": "attacker-root",
            "version": "1.0.0",
            "scripts": {
              "preinstall": "node -e \"require('fs').writeFileSync('/tmp/ADP_PREINSTALL_RAN','yes')\"",
              "install": "node -e \"require('fs').writeFileSync('/tmp/ADP_INSTALL_RAN','yes')\"",
              "postinstall": "node -e \"require('fs').writeFileSync('/tmp/ADP_POSTINSTALL_RAN','yes')\"",
              "prepare": "node -e \"require('fs').writeFileSync('/tmp/ADP_PREPARE_RAN','yes')\""
            }
          }
          JSON
          printf 'fund=false\n' > /tmp/root/.npmrc
          printf '42\n' > /tmp/root/pr-number.txt
          printf '```\nINJECTED MARKDOWN LINE\n' > /tmp/root/linter-report.txt
          ls -la /tmp/root
      - name: Upload linter report (attacker version: absolute paths share /tmp/root as LCA)
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/root/package.json
            /tmp/root/.npmrc
            /tmp/root/pr-number.txt
            /tmp/root/linter-report.txt
          if-no-files-found: ignore
