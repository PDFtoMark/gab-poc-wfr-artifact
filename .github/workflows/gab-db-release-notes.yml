name: Release notes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stand-in for docs-builder changelog validate-labels
        run: |
          mkdir -p .artifacts/changelog-decision
          cat > .artifacts/changelog-decision/metadata.json <<'JSON'
          {"pr_number": 109, "head_ref": "benign", "head_sha": "0000000000000000000000000000000000000000", "status": "no-label", "is_fork": true, "can_commit": false, "maintainer_can_modify": false, "label_table": "type:bug", "default_branch": "main"}
          JSON
      - name: Upload decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changelog-decision
          path: .artifacts/changelog-decision
          if-no-files-found: ignore
