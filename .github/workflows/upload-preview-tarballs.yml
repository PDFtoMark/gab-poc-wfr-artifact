name: upload-preview-tarballs

on:
  workflow_run:
    workflows: ['build-and-deploy']
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  upload:
    name: Upload preview tarballs to Blob (simulated)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download preview-tarballs artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enumerate exactly like scripts/upload-preview-tarballs.js (no network)
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          echo "triggering_run=${{ github.event.workflow_run.id }}"
          echo "event=${{ github.event.workflow_run.event }}"
          echo "head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "oidc_env_present=yes"; else echo "oidc_env_present=no"; fi
          root="${{ runner.temp }}/preview-tarballs"
          echo "--- artifact tree ---"
          find "$root" -type f | sort
          echo "--- packages that would be uploaded ---"
          for d in "$root"/*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            case "$name" in
              @*)
                for s in "$d"/*; do
                  [ -d "$s" ] || continue
                  tgz="$(find "$s" -maxdepth 1 -name '*.tgz' | head -1 || true)"
                  if [ -n "$tgz" ]; then echo "PKG=${name}/$(basename "$s") URL=/next/commits/${{ github.event.workflow_run.head_sha }}/${name}/$(basename "$s") BYTES=$(cat "$tgz")"; fi
                done
                ;;
              *)
                tgz="$(find "$d" -maxdepth 1 -name '*.tgz' | head -1 || true)"
                if [ -n "$tgz" ]; then echo "PKG=${name} URL=/next/commits/${{ github.event.workflow_run.head_sha }}/${name} BYTES=$(cat "$tgz")"; fi
                ;;
            esac
          done
