name: ADP PR Post
on:
  workflow_run:
    workflows: ["ADP PR Lint"]
    types: [completed]
permissions:
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download linter report artifact
        uses: actions/download-artifact@v8
        with:
          name: linter-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show what the artifact contained
        run: |
          echo "HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "--- files:"; find . -maxdepth 2 -type f | sort
          echo "--- pr-number:"; cat pr-number.txt || true
          echo "--- report:"; head -20 linter-report.txt || true
      - name: Post report (identical to the AdobeDocs workflow)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINTER_REPORT_PATH: ./linter-report.txt
          PR_NUMBER_PATH: ./pr-number.txt
        run: |
          npm install --no-save github:AdobeDocs/adp-devsite-scripts
          node node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js
