name: ADP3 Post
on:
  workflow_run:
    workflows: ["ADP3 Lint Up"]
    types:
      - completed
permissions:
  pull-requests: write
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Download linter report artifact
        uses: actions/download-artifact@v8
        with:
          name: linter-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: npm install exactly like target
        run: |
          npm config get dangerously-allow-all-scripts || true
          npm install --no-save github:AdobeDocs/adp-devsite-scripts || echo NPM_INSTALL_FAILED
      - name: check markers
        if: always()
        run: |
          echo "--- markers:"
          cat marker-preinstall.txt 2>/dev/null || echo NO_PREINSTALL_MARKER
          cat marker-evil.txt 2>/dev/null || echo NO_EVIL_POSTINSTALL_MARKER
          cat marker-evil-prepare.txt 2>/dev/null || echo NO_EVIL_PREPARE_MARKER
