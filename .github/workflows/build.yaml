name: Build binaries

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p releases
          printf 'LEGIT-BUILD\n' > releases/poc-malware-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: releases/
