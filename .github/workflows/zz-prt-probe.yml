name: PRT Probe
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: report
        run: |
          echo "PRT_FIRED=true"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repo=${{ github.repository }}"
